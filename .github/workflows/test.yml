name: Kontroller kode
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --check frontend/animated-map.js
      - run: node --test tests/animated-map.test.cjs
