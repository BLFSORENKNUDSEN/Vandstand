name: Opdater vandstand

on:
  workflow_dispatch:
  schedule:
    # DKSS kører fire gange i døgnet. Tiderne her giver modellen tid til at blive færdig.
    - cron: "30 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: waterlevel-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer ecCodes
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev libeccodes-tools

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer Python pakker
        run: pip install -r requirements.txt

      - name: Hent DMI punktprognoser
        run: python scripts/fetch_waterlevel.py --output data/waterlevel.json --hours 24 --step 3

      - name: Generer kombinerede DKSS XYZ tiles
        run: python scripts/generate_combined_tiles.py --output-dir data/waterlevel-tiles --hours 72 --step 1 --zoom 9

      - name: Kontroller resultat
        run: |
          python -m json.tool data/waterlevel.json >/dev/null
          python -m json.tool data/waterlevel-tiles/metadata.json >/dev/null
          test -n "$(find data/waterlevel-tiles -name '*.webp' -print -quit)"
          echo "Antal DKSS tiles: $(find data/waterlevel-tiles -name '*.webp' | wc -l)"
          head -180 data/waterlevel-tiles/metadata.json

      - name: Commit nye data
        run: |
          if git diff --quiet -- data/waterlevel.json data/waterlevel-tiles; then
            echo "Ingen ændring i vandstandsdata"
            exit 0
          fi
          git config user.name "strandvejr-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/waterlevel.json data/waterlevel-tiles
          git commit -m "Opdater kombineret DMI vandstandsprognose"
          git push
